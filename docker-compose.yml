version: "3.9"

services:
  app:
    build: .
    image: myphpapp:latest
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - DB_NAME=myapp
      - DB_USER=myapp
      - DB_PASS=${DB_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health.php"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "5"